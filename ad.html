<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOSTOS - An Ancient Greek Epic</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Including GSAP for the cinematic intro -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aegean: '#1B3B5F',
            wave: '#2E7D8C',
            gold: '#C9A24B',
            parchment: '#F1E7D0',
            ink: '#22252B',
          },
          fontFamily: {
            serif: ['"EB Garamond"', 'serif'],
          },
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B1017;
      color: #F1E7D0;
      font-family: 'EB Garamond', serif;
      margin: 0;
      overflow: hidden; /* Perfect for video frame */
    }
    
    #oceanCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .atmospheric-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(15,23,37,0.3) 0%, rgba(15,23,37,0.65) 70%, rgba(10,16,25,0.90) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .epic-title {
      font-size: clamp(6rem, 18vw, 15rem);
      line-height: 0.8;
      text-shadow: 0 10px 45px rgba(201,162,75,0.5);
    }
    
    .epic-subtitle {
      text-shadow: 0 4px 20px rgba(201,162,75,0.4);
    }
    
    .ship-container {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(75vw, 600px);
      z-index: 10;
      will-change: transform;
    }

    /* Ship subtle idle bobbing */
    @keyframes bob {
      0% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(8px) rotate(1.5deg); }
      66% { transform: translateY(-4px) rotate(-0.5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .ship-bob {
      animation: bob 4.5s ease-in-out infinite;
      transform-origin: center;
    }

    .pulse-compass {
      animation: pulse-slow 8s infinite ease-in-out;
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }
  </style>
</head>
<body class="antialiased selection:bg-gold selection:text-ink flex flex-col items-center justify-center min-h-screen relative">

          <line x1="192" y1="85" x2="188" y2="85" /><line x1="228" y1="85" x2="232" y2="85" />
          <line x1="197" y1="72" x2="194" y2="69" /><line x1="223" y1="98" x2="226" y2="101" />
          <line x1="197" y1="98" x2="194" y2="101" /><line x1="223" y1="72" x2="226" y2="69" />

        <!-- Churning Sea Foam -->
        <path d="M 40,165 Q 60,175 80,168 T 130,178 T 180,175 T 230,178 T 290,172 T 340,168 T 370,150" fill="none" stroke="#F1E7D0" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
        <path d="M 50,170 Q 75,182 105,175 T 160,183 T 225,182 T 285,178 T 350,160" fill="none" stroke="#2E7D8C" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
      </g>
    </svg>
  </div>

  <!-- Grand Text Layer -->
  <div class="relative z-20 text-center flex flex-col items-center justify-center w-full px-4 h-screen" id="heroText">
    
    <div class="mb-6 inline-block px-8 py-2 border border-gold/40 rounded-full text-gold uppercase tracking-[0.4em] text-sm md:text-lg font-bold bg-ink/70 backdrop-blur-md shadow-[0_0_20px_rgba(201,162,75,0.3)]">
      The Odyssey Begins
    </div>

    <h1 class="epic-title font-normal tracking-tight text-gold mb-8 uppercase">
      NOSTOS
    </h1>

    <div class="w-full max-w-3xl mb-12">
      <!-- Greek Key Divider -->
      <svg width="100%" height="24" viewBox="0 0 1000 24" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" class="text-gold/60 drop-shadow-md">
        <pattern id="greek-key" x="0" y="0" width="40" height="24" patternUnits="userSpaceOnUse">
          <path d="M0,20 L10,20 L10,4 L30,4 L30,20 L40,20 L40,12 L20,12 L20,16 L36,16 L36,8 L14,8 L14,24 L0,24" fill="none" stroke="currentColor" stroke-width="2" />
        </pattern>
        <rect x="0" y="0" width="100%" height="24" fill="url(#greek-key)" />
      </svg>
    </div>

    <p class="epic-subtitle max-w-4xl text-3xl md:text-5xl text-parchment font-medium italic leading-relaxed">

    <div class="mt-20 flex gap-6">
      <button id="startJourneyBtn" class="relative overflow-hidden px-12 py-6 bg-gold/10 hover:bg-gold/20 border border-gold backdrop-blur-lg rounded-lg shadow-[0_0_40px_rgba(201,162,75,0.3)] transition-all duration-500 group cursor-pointer hover:scale-105 active:scale-95">
        <div class="absolute inset-0 bg-white/20 transform -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
        <p class="text-gold text-2xl md:text-3xl uppercase tracking-[0.3em] font-bold drop-shadow-md relative z-10">Start Your Journey</p>
      </button>

  </div>

  <!-- Full Screen Flash for Video Cut Transition -->
  <div id="transitionFlash" class="fixed inset-0 bg-[#FFFCF5] z-[100] opacity-0 pointer-events-none mix-blend-screen" style="box-shadow: inset 0 0 100px rgba(201,162,75,0.8);"></div>

  <script>
    // --- Ocean Canvas Animation Logic ---
    const canvas = document.getElementById('oceanCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    const stars = [], particles = [], fogBands = [], rainDrops = [];
    let lightning = null;
    let time = 0;
    let flash = 0;

    const waveLayers = [
      [0.55, 40, 380, 1.3, 0.98, 0],
      [0.62, 34, 310, 1.7, 0.94, 1],
      [0.69, 28, 250, 2.1, 0.88, 2],
      [0.77, 22, 200, 2.6, 0.80, 3],
      [0.85, 16, 160, 3.1, 0.68, 4],
    ];

    const oceanColors = [
      'rgba(15, 23, 37, 1)',
      'rgba(27, 59, 95, 0.96)',
      'rgba(35, 75, 115, 0.90)',
      'rgba(46, 125, 140, 0.84)',
      'rgba(30, 95, 110, 0.70)',
    ];

    function setup() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      stars.length = 0;
      const starCount = Math.floor((width * height) / 15000);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height * 0.45,
          r: Math.random() * 1.2 + 0.3,
          baseAlpha: Math.random() * 0.45 + 0.2,
          twinkleSpeed: Math.random() * 2.2 + 0.8,
          twinkleOffset: Math.random() * Math.PI * 2,
        });
      }

      fogBands.length = 0;
      for (let i = 0; i < 3; i++) {
        fogBands.push({
          y: height * (0.35 + i * 0.12),
          speed: 0.05 + i * 0.02,
          amp: 16 + i * 5,
          offset: Math.random() * Math.PI * 2,
          opacity: 0.04 + i * 0.015,
        });
      }

      rainDrops.length = 0;
      const rainCount = Math.floor(width / 12);
      for (let i = 0; i < rainCount; i++) {
        rainDrops.push({
          x: Math.random() * (width + 300) - 150,
          y: Math.random() * height,
          length: Math.random() * 18 + 14,
          vy: Math.random() * 8 + 16,
          vx: -2.0,
          alpha: Math.random() * 0.30 + 0.22,
        });
      }
    }

    setup();
    window.addEventListener('resize', setup);

    function spawnSprayParticle() {
      const isSpray = Math.random() < 0.7;
      particles.push({
        x: Math.random() * width * 1.2 - width * 0.1,
        y: isSpray ? height * (0.55 + Math.random() * 0.35) : height + 10,
        vx: Math.random() * 1.4 + 0.4,
        vy: -(Math.random() * 1.1 + 0.3),
        size: isSpray ? Math.random() * 2.0 + 0.8 : Math.random() * 1.4 + 0.4,
        life: 0,
        maxLife: Math.random() * 140 + 70,
        alpha: 0,
        color: isSpray ? 'rgba(241, 231, 208, ' : 'rgba(46, 125, 140, ',
      });
    }

    function getWaveY(x, baseY, amp, wavelength, t, speed, layerIdx) {
      const p1 = (x / wavelength) * Math.PI * 2 + t * speed * 0.012 + layerIdx * 1.5;
      const p2 = (x / (wavelength * 0.42)) * Math.PI * 2 - t * speed * 0.018;
      return baseY + (Math.sin(p1) + 0.45 * Math.sin(p2)) * amp;
    }

    function draw() {
      requestAnimationFrame(draw);
      time += 1;
      
      // Lightning trigger
      if (Math.random() < 0.0035) {
        flash = Math.random() * 0.5 + 0.45;
        let startX = Math.random() * (width * 0.7) + width * 0.15;
        let points = [{ x: startX, y: 0 }];
        let currX = startX, currY = 0;
        while (currY < height * 0.58) {
          currX += (Math.random() - 0.5) * 55;
          currY += Math.random() * 45 + 25;
          points.push({ x: currX, y: currY });
        }
        lightning = { points, opacity: 1.0 };
      }

      if (flash > 0) {
        flash *= 0.84;
        if (flash < 0.01) flash = 0;
      }

      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#0B1017');
      skyGrad.addColorStop(0.4, '#121E2C');
      skyGrad.addColorStop(0.7, '#1B3B5F');
      skyGrad.addColorStop(1, '#0D1B2A');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      if (flash > 0) {
        ctx.fillStyle = `rgba(255, 245, 215, ${flash * 0.5})`;
        ctx.fillRect(0, 0, width, height);
      }

      // Lightning
      if (lightning && lightning.opacity > 0) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 252, 235, ${lightning.opacity})`;
        ctx.lineWidth = 2.5;
        for (let i = 0; i < lightning.points.length; i++) {
          if (i === 0) ctx.moveTo(lightning.points[i].x, lightning.points[i].y);
          else ctx.lineTo(lightning.points[i].x, lightning.points[i].y);
        }
        ctx.stroke();
        lightning.opacity *= 0.72;
        if (lightning.opacity < 0.05) lightning = null;
      }

      // Stars
      for (let s of stars) {
        const tw = Math.sin(time * 0.02 * s.twinkleSpeed + s.twinkleOffset) * 0.5 + 0.5;
        ctx.beginPath();
        ctx.fillStyle = `rgba(241, 231, 208, ${s.baseAlpha * (0.3 + tw * 0.7) * 0.8})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Moon
      const moonX = width * 0.8, moonY = height * 0.18, moonR = Math.min(width, height) * 0.05;
      const halo = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, moonR * 4);
      halo.addColorStop(0, 'rgba(201, 162, 75, 0.35)');
      halo.addColorStop(0.3, 'rgba(46, 125, 140, 0.12)');
      halo.addColorStop(1, 'rgba(27, 59, 95, 0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, width, height);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(241, 231, 208, 0.85)';
      ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
      ctx.fill();

      // Rain
      ctx.lineWidth = 1.3;
      for (let drop of rainDrops) {
        drop.x += drop.vx;
        drop.y += drop.vy;
        if (drop.y > height) {
          drop.y = -drop.length - Math.random() * 40;
          drop.x = Math.random() * (width + 300) - 150;
        }
        ctx.beginPath();
        ctx.strokeStyle = `rgba(220, 238, 255, ${drop.alpha + flash * 0.2})`;
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x + drop.vx * 1.5, drop.y + drop.length);
        ctx.stroke();
      }

      // Fog
      for (let band of fogBands) {
        const drift = (time * band.speed) % width;
        ctx.beginPath();
        ctx.moveTo(0, band.y);
        for (let x = 0; x <= width; x += 40) {
          ctx.lineTo(x, band.y + Math.sin((x + drift) * 0.007 + band.offset) * band.amp);
        }
        ctx.lineTo(width, height); ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fillStyle = `rgba(46, 125, 140, ${band.opacity + flash * 0.03})`;
        ctx.fill();
      }

      // Waves
      for (let li = 0; li < waveLayers.length; li++) {
        const [yFrac, amp, wavelength, speed, opacity, colorIndex] = waveLayers[li];
        const baseY = height * yFrac + li * 14;

        ctx.beginPath();
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= width + 8; x += 8) {
          ctx.lineTo(x, getWaveY(x, baseY, amp, wavelength, time, speed, li));
        }
        ctx.lineTo(width + 10, height + 30);
        ctx.lineTo(-10, height + 30);
        ctx.closePath();
        ctx.fillStyle = oceanColors[colorIndex].replace(/[\d.]+\)$/, `${opacity})`);
        ctx.fill();

        // Foam
        if (li < 3) {
          ctx.beginPath();
          for (let x = 0; x <= width + 8; x += 8) {
            let y = getWaveY(x, baseY, amp, wavelength, time, speed, li);
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = `rgba(241, 231, 208, ${Math.min(1, opacity * 0.65 + flash * 0.2)})`;
          ctx.lineWidth = li === 0 ? 2.0 : 1.2;
          ctx.stroke();
        }
      }

      // Particles
      while (particles.length < 40) spawnSprayParticle();
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.life += 1; pt.x += pt.vx; pt.y += pt.vy;
        const lifeRatio = pt.life / pt.maxLife;
        pt.alpha = Math.max(0, Math.min(1, lifeRatio < 0.25 ? lifeRatio * 4 : 1 - (lifeRatio - 0.25) / 0.75));
        ctx.beginPath();
        ctx.fillStyle = pt.color + (pt.alpha * 0.7) + ')';
        ctx.arc(pt.x, pt.y, pt.size * 0.8, 0, Math.PI * 2);
        ctx.fill();
        if (pt.life >= pt.maxLife || pt.y < -20 || pt.x > width + 50) particles.splice(i, 1);
      }
    }
    
    requestAnimationFrame(draw);

    // --- Cinematic GSAP Entry Animation ---
    window.addEventListener('DOMContentLoaded', () => {
      // Set initial states
      gsap.set('#shipContainer', { xPercent: -140, scale: 0.35, yPercent: 5, opacity: 0 });
      gsap.set('#heroText', { opacity: 0, y: 60, filter: "blur(15px)" });

      const tl = gsap.timeline();
      
      // 1. Ship approaches from the left horizon
      tl.to('#shipContainer', { opacity: 1, xPercent: -90, scale: 0.55, yPercent: 5, duration: 2.5, ease: "power1.out" })
      // 2. Ship sails into focus
        .to('#shipContainer', { xPercent: 0, scale: 0.95, yPercent: 5, duration: 2.5, ease: "power2.out" })
      // 3. Ship settles slightly into the background to make room for text
        .to('#shipContainer', { scale: 0.65, opacity: 0.55, yPercent: 25, duration: 2.0, ease: "power2.inOut" }, "+=0.5")
      // 4. Epic title and typography reveal
        .to('#heroText', { opacity: 1, y: 0, filter: "blur(0px)", duration: 2.0, ease: "power2.out" }, "-=1.5");
        
      // Transition out effect
      const startBtn = document.getElementById('startJourneyBtn');
      const transitionFlash = document.getElementById('transitionFlash');
      
      startBtn.addEventListener('click', () => {
        // Trigger massive thunder flash in the canvas
        flash = 2.0; 
        
        // Ship sails straight at camera
        gsap.to('#shipContainer', {
          scale: 4.0,
          yPercent: 80,
          opacity: 0,
          duration: 1.0,
          ease: "power2.in"
        });
        
        // Push the hero text towards the viewer
        gsap.to('#heroText', {
          scale: 1.1,
          opacity: 0,
          filter: "blur(20px)",
          duration: 0.8,
          ease: "power2.in"
        });

        // Massive golden/white flash overlay for transition cut
        gsap.to(transitionFlash, { 
          opacity: 1, 
          duration: 0.8, 
          ease: "power2.in",
          onComplete: () => {
            // Screen is completely white, ready for cut!
            console.log("Ready for video cut!");
          }
        });
      });
    });
  </script>
</body>
</html>
